name: tableplan

services:
  tableplan:
    container_name: tableplan
    image: ghcr.io/thomasjvalenzuela/tableplan:latest
    restart: unless-stopped
    depends_on:
      - mealie
    ports:
      - "9930:8080"
    environment:
      TZ: $TZ
      MEALIE_URL: http://mealie:9000
      MEALIE_PUBLIC_PORT: "9925"
      TABLEPLAN_INSTALL: zimaos
    volumes:
      - /DATA/AppData/tableplan/data:/data
    networks:
      - tableplan

  mealie:
    container_name: tableplan-mealie
    image: ghcr.io/mealie-recipes/mealie:v3.30.0
    restart: unless-stopped
    ports:
      - "9925:9000"
    environment:
      TZ: $TZ
      ALLOW_SIGNUP: "false"
      MAX_WORKERS: "1"
      WEB_CONCURRENCY: "1"
    volumes:
      - /DATA/AppData/tableplan/mealie:/app/data
    deploy:
      resources:
        limits:
          memory: 1000M
    networks:
      - tableplan

networks:
  tableplan:
    driver: bridge

x-casaos:
  id: io.github.thomasjvalenzuela.tableplan
  store_app_id: tableplan
  main: tableplan
  index: /
  port_map: "9930"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/thomasjvalenzuela/tableplan@main/zimaos-store/Apps/TablePlan/icon.svg
  title:
    en_US: TablePlan
  tagline:
    en_US: Recipes, auto meal plans, a smart pantry and grocery lists
  description:
    en_US: |
      TablePlan is a household kitchen app for your home server.

      • Save recipes from any link, screenshot or cookbook photo (AI import with your own OpenAI key)
      • Auto-generate a week or month of meals from your recipes, with no repeats and favorites first
      • Every recipe scales to the number of people you cook for
      • Smart pantry: check items off the shopping list and they get real use-by dates (USDA FoodKeeper). Use half the cream and the date resets to after-opening.
      • Email, print or export shopping lists, meal plans (.ics calendar) and pantry reports

      Includes Mealie (open source, AGPL-3.0) as the recipe engine. Open TablePlan after installing and the setup wizard does the rest.
  tips:
    before_install:
      en_US: |
        After installing, open TablePlan. A short setup wizard creates your recipe-library login and, if you want, sets up AI import and email.
        Mealie also runs on port 9925 for advanced recipe editing.
  author: thomasjvalenzuela
  developer: thomasjvalenzuela
  category: Home
  architectures:
    - amd64
    - arm64
  version: "0.2.0"
  update_at: "2026-11-08"
  release_notes:
    en_US: First release with the setup wizard.
  website: https://github.com/thomasjvalenzuela/tableplan
  repo: https://github.com/thomasjvalenzuela/tableplan
  support: https://github.com/thomasjvalenzuela/tableplan/issues
