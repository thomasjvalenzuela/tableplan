name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Compile Python
        run: python -m py_compile app/server.py app/native/*.py

      - name: Unit tests
        run: python -m unittest discover -s app/tests -t .

      - name: Check JavaScript syntax
        run: |
          for f in app/static/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Check installer script syntax
        run: |
          bash -n install/install.sh
          sh -n docker/entrypoint.sh

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: tableplan:ci
          build-args: VERSION=ci

      - name: Smoke test (runs as uid 1000, /health answers)
        run: |
          docker run -d --name tp -p 8080:8080 tableplan:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs tp
          [ "${ok:-0}" = 1 ] || { echo "::error::/health did not answer"; exit 1; }
          uid="$(docker exec tp sh -c 'cat /proc/1/status' | awk '/^Uid:/ {print $2}')"
          echo "server uid: $uid"
          [ "$uid" = 1000 ] || { echo "::error::server is not running as uid 1000"; exit 1; }
          docker rm -f tp
