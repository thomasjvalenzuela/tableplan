# Weekly: if Mealie has a newer release than the one TablePlan bundles, open a pull request that bumps it.
# Merging the PR triggers a TablePlan release, so ZimaOS users get the new Mealie through the normal Update button.
name: Check for Mealie updates

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare bundled and latest Mealie
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="$(grep -oE 'mealie-recipes/mealie:v[0-9]+\.[0-9]+\.[0-9]+' zimaos-store/Apps/TablePlan/docker-compose.yml | head -1 | sed 's/.*://')"
          latest="$(gh api repos/mealie-recipes/mealie/releases/latest --jq .tag_name)"
          echo "current=$current latest=$latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          # Only bump within the same major version automatically; a new major needs a human look.
          if [ "$latest" != "$current" ] && [ "${latest%%.*}" = "${current%%.*}" ] && \
             [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" = "$latest" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the Mealie version everywhere
        if: steps.v.outputs.bump == 'true'
        run: |
          for f in zimaos-store/Apps/TablePlan/docker-compose.yml install/install.sh install/docker-compose.yml; do
            sed -i "s#mealie-recipes/mealie:${{ steps.v.outputs.current }}#mealie-recipes/mealie:${{ steps.v.outputs.latest }}#g" "$f"
          done
          git diff --stat

      - name: Open pull request
        if: steps.v.outputs.bump == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: mealie-${{ steps.v.outputs.latest }}
          title: "Update bundled Mealie to ${{ steps.v.outputs.latest }}"
          commit-message: "Update bundled Mealie to ${{ steps.v.outputs.latest }}"
          body: |
            Mealie **${{ steps.v.outputs.latest }}** is out (TablePlan currently bundles ${{ steps.v.outputs.current }}).

            Before merging, skim the [release notes](https://github.com/mealie-recipes/mealie/releases/tag/${{ steps.v.outputs.latest }}) for API changes
            to anything TablePlan uses (see CONTRIBUTING.md → "Updating the bundled Mealie").

            Merging publishes a new TablePlan release, and ZimaOS users will see **Update**.
          delete-branch: true
