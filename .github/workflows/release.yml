# Every push to main:
#   1. builds the TablePlan image (amd64 + arm64) → ghcr.io/<owner>/tableplan:<version> and :latest
#   2. stamps that version into the ZimaOS store definition and publishes the store to GitHub Pages
#   3. publishes version.json (the in-app "update available" banner reads it) and the setup guide
# ZimaOS sees the store's new version/content hash and offers "Update" for TablePlan.

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Nothing by default; the job below asks only for what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # push the gh-pages branch
      packages: write   # push the image to GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Work out version and names
        id: v
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          case "$base" in *[!0-9.]*|"") echo "::error::VERSION must look like 0.4"; exit 1 ;; esac
          version="${base}.${RUN_NUMBER}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/${repo}" >> "$GITHUB_OUTPUT"
          echo "pages=https://${owner}.github.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          # First line of the commit message becomes the release note. It is only ever
          # passed to later steps through env vars, never expanded inside a script.
          # A random heredoc delimiter stops a crafted subject from injecting outputs.
          delim="NOTES_$(openssl rand -hex 16)"
          printf 'notes<<%s\n%s\n%s\n' "$delim" "$(git log -1 --pretty=%s)" "$delim" >> "$GITHUB_OUTPUT"

      # ---------- image
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- ZimaOS store
      - name: Stamp version into the store definition
        env:
          VERSION: ${{ steps.v.outputs.version }}
          IMAGE: ${{ steps.v.outputs.image }}
          OWNER: ${{ steps.v.outputs.owner }}
          REPO: ${{ steps.v.outputs.repo }}
          DATE: ${{ steps.v.outputs.date }}
          NOTES: ${{ steps.v.outputs.notes }}
        run: |
          f=zimaos-store/Apps/TablePlan/docker-compose.yml
          python3 - "$f" <<'PY'
          import os, re, sys
          p = sys.argv[1]; s = open(p).read()
          v, img = os.environ["VERSION"], os.environ["IMAGE"]
          owner, repo = os.environ["OWNER"], os.environ["REPO"]
          s = re.sub(r"image: ghcr\.io/[^/\s]+/tableplan:\S+", f"image: {img}:{v}", s)
          s = re.sub(r'version: "[^"]*"', f'version: "{v}"', s, count=1)
          s = re.sub(r'update_at: "[^"]*"', f'update_at: "{os.environ["DATE"]}"', s, count=1)
          import json
          notes = json.dumps(os.environ["NOTES"])          # quoted → safe even with ':' or '#'
          s = re.sub(r"(release_notes:\n\s+en_US: ).*", lambda m: m.group(1) + notes, s, count=1)
          s = s.replace("thomasjvalenzuela/tableplan", f"{owner}/{repo}")
          s = s.replace("io.github.thomasjvalenzuela.tableplan", f"io.github.{owner}.{repo}")
          open(p, "w").write(s)
          PY
          sed -i "s#thomasjvalenzuela/tableplan#${OWNER}/${REPO}#g" zimaos-store/store-config.json
          grep -nE "image:|version:|update_at" "$f"

      - name: Build ZimaOS store (v2)
        uses: IceWhaleTech/build-appstore-action@c9bb47fad5b32d7928a07978fad68801f52e910f # v1.1.3
        with:
          source: zimaos-store
          output: dist
          base-url: ${{ steps.v.outputs.pages }}

      - name: Add version feed, installer and setup guide
        env:
          VERSION: ${{ steps.v.outputs.version }}
          DATE: ${{ steps.v.outputs.date }}
          NOTES: ${{ steps.v.outputs.notes }}
        run: |
          python3 -c "import json,os; json.dump({'version':os.environ['VERSION'],'released':os.environ['DATE'],'notes':os.environ['NOTES']}, open('dist/version.json','w'))"
          cp install/install.sh dist/install.sh
          cp install/docker-compose.yml dist/docker-compose.yml
          mkdir -p dist/setup && cp docs/setup.html dist/setup/index.html
          touch dist/.nojekyll
          ls -R dist | head -50

      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Release ${{ steps.v.outputs.version }}"

      - name: Summary
        env:
          VERSION: ${{ steps.v.outputs.version }}
          IMAGE: ${{ steps.v.outputs.image }}
          PAGES: ${{ steps.v.outputs.pages }}
        run: |
          {
            echo "### TablePlan ${VERSION}"
            echo "- Image: \`${IMAGE}:${VERSION}\`"
            echo "- ZimaOS community store URL: ${PAGES}/store.json"
            echo "- SSH install: \`curl -fsSL ${PAGES}/install.sh | sudo bash\`"
          } >> "$GITHUB_STEP_SUMMARY"
